<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <style>
      .axis { stroke: #2D3748; stroke-width: 2; marker-end: url(#arrow); }
      .parabola_ok { stroke: green; stroke-width: 3; fill: none; }
      .parabola_nok { stroke: #44444444; stroke-width: 3; fill: none; }
      .text-main { font-family: 'Segoe UI', sans-serif; font-size: 14px; fill: #2D3748; }
      .text-bold { font-family: 'Segoe UI', sans-serif; font-size: 16px; font-weight: bold; }
      .sign-pos { fill: #E53E3E; font-weight: bold; font-size: 18px; }
      .sign-neg { fill: #38A169; font-weight: bold; font-size: 18px; }
      .root-point { fill: #38A169; stroke: #38A169; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2D3748"/>
    </marker>
  </defs>
  <line x1="50" y1="200" x2="550" y2="200" class="axis"/>
  <text x="540" y="220" class="text-main" style="white-space: pre;">x</text>
  <path d="M 120 60 C 146.994 119.987 173.989 166.481 200.983 199.479" class="parabola_nok"/>
  <path d="M 399.613 198.748 C 426.409 165.795 453.204 119.546 480 60" class="parabola_nok"/>
  <path d="M 200.983 199.479 C 267.193 280.416 333.403 280.173 399.613 198.748" class="parabola_ok"/>
  <circle cx="200" cy="200" r="5" class="root-point"/>
  <text x="200" y="225" text-anchor="middle" class="text-main" style="white-space: pre;">x₁=1</text>
  <circle cx="400" cy="200" r="5" class="root-point"/>
  <text x="400" y="225" text-anchor="middle" class="text-main" style="white-space: pre;">x₂=5</text>
  <text x="130" y="170" text-anchor="middle" class="sign-pos" style="white-space: pre;">+</text>
  <text x="300" y="230" text-anchor="middle" class="sign-neg" style="white-space: pre;">-</text>
  <text x="470" y="170" text-anchor="middle" class="sign-pos" style="white-space: pre;">+</text>
</svg>