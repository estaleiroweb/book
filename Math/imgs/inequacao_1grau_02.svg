<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      .axis-line { stroke: #4A5568; stroke-width: 2; fill: none; }
      .tick-line { stroke: #718096; stroke-width: 1.5; }
      .axis-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; fill: #2D3748; text-anchor: middle; }
      .expression-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #2B6CB0; text-anchor: middle; }
      .solution-ray { stroke: #2B6CB0; stroke-width: 5; stroke-linecap: round; fill: none; }
      .closed-circle { fill: #2B6CB0; stroke: #2B6CB0; stroke-width: 1; }
    </style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4A5568" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F7FAFC" rx="8" />

  <text x="300" y="50" class="expression-text">x ≤ -5</text>

  <line x1="60" y1="120" x2="540" y2="120" class="axis-line" marker-start="url(#arrow)" marker-end="url(#arrow)" />

  <line x1="140" y1="112" x2="140" y2="120" class="tick-line" />
  <text x="140" y="142" class="axis-text">-9</text>

  <line x1="180" y1="112" x2="180" y2="120" class="tick-line" />
  <text x="180" y="142" class="axis-text">-8</text>

  <line x1="220" y1="112" x2="220" y2="120" class="tick-line" />
  <text x="220" y="142" class="axis-text">-7</text>

  <line x1="260" y1="112" x2="260" y2="120" class="tick-line" />
  <text x="260" y="142" class="axis-text">-6</text>

  <line x1="300" y1="112" x2="300" y2="120" class="tick-line" />
  <text x="300" y="142" class="axis-text" font-weight="bold">-5</text>

  <line x1="340" y1="112" x2="340" y2="120" class="tick-line" />
  <text x="340" y="142" class="axis-text">-4</text>

  <line x1="380" y1="112" x2="380" y2="120" class="tick-line" />
  <text x="380" y="142" class="axis-text">-3</text>

  <line x1="420" y1="112" x2="420" y2="120" class="tick-line" />
  <text x="420" y="142" class="axis-text">-2</text>

  <line x1="460" y1="112" x2="460" y2="120" class="tick-line" />
  <text x="460" y="142" class="axis-text">-1</text>

  <line x1="300" y1="120" x2="70" y2="120" class="solution-ray" marker-end="url(#arrow)" />
  
  <circle cx="300" cy="120" r="6" class="closed-circle" />
</svg>
