<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <style>
      .axis { stroke: #2D3748; stroke-width: 2; marker-end: url(#arrow); }
      .parabola { stroke: #DD6B20; stroke-width: 3; fill: none; }
      .sign-neg { fill: #E53E3E; font-weight: bold; font-size: 16px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2D3748" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC" rx="6" />
  <line x1="40" y1="50" x2="360" y2="50" class="axis" />
  <path d="M 90,150 Q 200,-20 310,150" class="parabola" />
  <text x="200" y="80" text-anchor="middle" class="sign-neg">-</text>
</svg>
